name: "Coding Standards"
on:
  workflow_dispatch: null
permissions:
  contents: "write"
  pull-requests: "write"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  fix:
    name: "Fix"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout repository"
      uses: "actions/checkout@v6"
    - name: "Install dependencies"
      run: "composer install"
    - name: "Fix violations"
      run: |
        # phpcbf auto-discovers .phpcs.xml.dist — the same ruleset the
        # integrate.yml quality gate enforces. phpcbf exits 1 on success.
        vendor/bin/phpcbf || true
        # Complex errors need a second run
        vendor/bin/phpcbf || true
    - name: "Check difference to repository"
      id: "list_diff"
      run: |
        if ! git diff --exit-code; then
          echo "exit_status=1" >>"${GITHUB_OUTPUT}"
        fi
    - name: "Create pull request"
      if: "${{ steps.list_diff.outputs.exit_status == '1' }}"
      uses: "peter-evans/create-pull-request@v6"
      with:
        add-paths: |
          *.php
        branch: "cs-fixer"
        commit-message: "Fix CS"
        title: "Fix Coding Standards violations"
        body: |
            Automated changes by running `phpcbf`.
        delete-branch: true

name: "Coding Standards"
on:
  workflow_dispatch: null
permissions:
  contents: "write"
  pull-requests: "write"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  fix:
    name: "Fix"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout repository"
      uses: "actions/checkout@v7"
    - name: "Set up PHP and Composer"
      # Pinned to the same version the integrate.yml quality gate runs, so
      # phpcbf cannot produce fixes that gate then rejects.
      uses: "./.github/actions/setup-php-composer"
      with:
        php-version: "8.4"
    - name: "Fix violations"
      run: |
        # phpcbf auto-discovers .phpcs.xml.dist — the same ruleset the
        # integrate.yml quality gate enforces.
        #
        # phpcbf exit codes: 0 clean, 1 violations fixed, 2 some left
        # unfixable, 3 error. Only 0 and 1 are expected here; swallowing
        # 2 and 3 too would let a genuine tooling failure look identical
        # to "already clean", since the diff check below would then find
        # nothing and the workflow would end quietly with no PR.
        #
        # Twice, because complex errors need a second pass.
        for attempt in 1 2; do
          vendor/bin/phpcbf && continue
          status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::phpcbf exited ${status} on pass ${attempt}"
            exit "$status"
          fi
        done
    - name: "Check difference to repository"
      id: "list_diff"
      run: |
        if ! git diff --exit-code; then
          echo "exit_status=1" >>"${GITHUB_OUTPUT}"
        fi
    - name: "Create pull request"
      if: "${{ steps.list_diff.outputs.exit_status == '1' }}"
      uses: "peter-evans/create-pull-request@v6"
      with:
        add-paths: |
          *.php
        branch: "cs-fixer"
        commit-message: "Fix CS"
        title: "Fix Coding Standards violations"
        body: |
            Automated changes by running `phpcbf`.
        delete-branch: true

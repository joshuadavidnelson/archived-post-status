name: "Coding Standards"
on:
  workflow_dispatch: null
permissions:
  contents: "write"
  pull-requests: "write"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  fix:
    name: "Fix"
    runs-on: "ubuntu-latest"
    env:
      PHP_VERSION: "8.4"
    steps:
    - name: "Checkout repository"
      uses: "actions/checkout@v6"
    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ env.PHP_VERSION }}
        tools: composer:v2
    - name: "Install Composer dependencies"
      run: "composer install --no-interaction --prefer-dist"
    - name: "Fix violations"
      run: |
        # phpcbf reads .phpcs.xml.dist and exits with 1 when it fixed something
        composer phpcbf || true
        # Complex errors need a second run
        composer phpcbf || true
    - name: "Check difference to repository"
      id: "list_diff"
      run: |
        if ! git diff --exit-code; then
          echo "exit_status=1" >>"${GITHUB_OUTPUT}"
        fi
    - name: "Create pull request"
      if: "${{ steps.list_diff.outputs.exit_status == '1' }}"
      uses: "peter-evans/create-pull-request@v6"
      with:
        add-paths: |
          *.php
        branch: "cs-fixer"
        commit-message: "Fix CS"
        title: "Fix Coding Standards violations"
        body: |
            Automated changes by running `phpcbf`.
        delete-branch: true

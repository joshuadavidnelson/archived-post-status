name: "Deploy to WordPress.org"

# Only semver-shaped tags trigger a deploy. The shared workflow requires the
# workflows below to be green on the tagged commit, then waits for approval
# in the "wordpress-org" environment before it touches SVN.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  deploy:
    uses: joshuadavidnelson/ci/.github/workflows/wp-deploy.yml@v1
    permissions:
      actions: read
      contents: read
    with:
      slug: "archived-post-status"
      required-workflows: |
        Integrate
        Unit Tests
        WP Plugin Check
    secrets: inherit

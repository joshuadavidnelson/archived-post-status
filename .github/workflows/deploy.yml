name: "Deploy to WordPress.org"

# Three gates stand between a tag push and the public SVN repo:
#   1. Only semver-shaped tags trigger the workflow at all.
#   2. The verify job requires the tagged commit to have green CI runs.
#   3. The deploy job runs in the "wordpress-org" environment, which must
#      be configured in the repository settings with a required reviewer —
#      the deploy waits for a manual approval click before touching SVN.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  verify:
    name: "Verify CI passed for the tagged commit"
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: "Require green check runs on the tagged SHA"
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef( {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100,
            } );

            // Ignore this workflow's own jobs on the tag ref.
            const runs = data.check_runs.filter(
              ( run ) => ! [ 'Verify CI passed for the tagged commit', 'New tag' ].includes( run.name )
            );

            const bad = runs.filter( ( run ) =>
              [ 'failure', 'cancelled', 'timed_out', 'action_required' ].includes( run.conclusion )
            );
            if ( bad.length ) {
              core.setFailed(
                `Tagged commit has failing checks: ${ bad.map( ( run ) => run.name ).join( ', ' ) }`
              );
              return;
            }

            // The unit-test matrix alone produces five runs; fewer
            // successes means the commit was tagged before CI ran on it.
            const good = runs.filter( ( run ) => 'success' === run.conclusion );
            if ( good.length < 5 ) {
              core.setFailed(
                `Only ${ good.length } successful check runs found on the tagged commit — push the branch, let CI finish, then tag.`
              );
            }

  deploy:
    name: "New tag"
    needs: verify
    # Requires a "wordpress-org" environment in the repository settings
    # with a required reviewer; the run pauses here for manual approval.
    environment: wordpress-org
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "WordPress Plugin Deploy"
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: archived-post-status

name: 'WP Plugin Check'
on:
  pull_request: null
  push:
    branches:
    - stable
    - develop

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # wp_function_not_compatible_with_requires_wp: the check can't see
    # function_exists() guards, so it flags guarded calls to newer core
    # functions (see Notices::render_notices()). phpstan's wp-compat rules
    # still catch unguarded ones.
    #
    # PrefixAllGlobals: the action expects the slug as the prefix, but the
    # plugin's public prefix is `aps_` and the action can't be told otherwise.
    # NonPrefixedVariableFound also fires on locals in uninstall.php, which
    # runs in the global scope.
    - name: Run plugin check
      uses: wordpress/plugin-check-action@v1
      with:
        exclude-directories: 'vendor,node_modules,tests,.github,.git,.wordpress-org,bin,reports'
        exclude-files: 'package.json,package-lock.json,composer.json,composer.lock,contributing.md,code-of-conduct.md,phpstan.neon.dist,phpunit.xml.dist,readme.md,changelog.md,.phpcs.xml.dist,.gitbook.yaml,jest.config.js,LICENSE'
        ignore-codes: 'hidden_files,wp_function_not_compatible_with_requires_wp,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedHooknameFound,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedFunctionFound,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedVariableFound'

name: 'WP Plugin Check'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
    - stable
    - develop
    - 'release/*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run plugin check
      uses: wordpress/plugin-check-action@v1
      with:
        exclude-directories: 'vendor,node_modules,tests,.github,.git,.wordpress-org'
        exclude-files: 'package.json,package-lock.json,composer.json,composer.lock,contributing.md,code-of-conduct.md,phpstan.neon.dist,phpunit.xml.dist,readme.md,changelog.md,.phpcs.xml.dist,.gitbook.yaml'
        ignore-codes: |
          hidden_files

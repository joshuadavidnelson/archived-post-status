name: "Plugin asset/readme update"

# Syncs readme.txt and .wordpress-org assets to the plugin's SVN trunk.
# Scoped to the files it actually ships so ordinary code commits to
# stable do not invoke a credentialed write to WordPress.org.
on:
  push:
    branches:
      - stable
    paths:
      - "readme.txt"
      - ".wordpress-org/**"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"

jobs:
  trunk:
    uses: joshuadavidnelson/ci/.github/workflows/wp-readme-deploy.yml@v1
    with:
      slug: "archived-post-status"
    secrets:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

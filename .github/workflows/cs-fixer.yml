name: "Coding Standards"

# Runs phpcbf with the same PHP as the Integrate quality job and opens a PR
# with the fixes.
on:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  fix:
    uses: joshuadavidnelson/ci/.github/workflows/cs-fixer.yml@v1
    permissions:
      contents: write
      pull-requests: write

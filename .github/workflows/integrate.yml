name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - stable
      - develop

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  syntax-check:
    name: "Syntax check on all PHP versions"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Set up PHP and Composer"
      uses: "./.github/actions/setup-php-composer"
      with:
        php-version: ${{ matrix.php }}

    - name: "PHP lint"
      run: "composer lint"

  code-quality:
    name: "Code quality checks"
    runs-on: "ubuntu-latest"
    needs: syntax-check
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Set up PHP and Composer"
      uses: "./.github/actions/setup-php-composer"
      with:
        php-version: "8.4"

    - name: "Run PHPCS"
      run: "composer phpcs"

    - name: "Run PHPStan"
      run: "composer phpstan"

    - name: "Run PHPMD"
      run: "composer run phpmd"

  code-analysis:
    name: "Code Analysis & Metrics"
    runs-on: "ubuntu-latest"
    needs: [syntax-check, code-quality]
    if: github.event_name == 'pull_request'
    permissions:
      contents: "read"
      pull-requests: "write"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Checkout base branch for comparison"
      uses: "actions/checkout@v7"
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: ".base"

    - name: "Set up PHP and Composer"
      uses: "./.github/actions/setup-php-composer"
      with:
        php-version: "8.4"

    - name: "Generate metrics summary"
      run: |
        composer run phpmetrics-summary
        test -s reports/metrics-summary.json || {
          echo "::error::PHPMetrics produced no summary for the PR branch."
          exit 1
        }

    - name: "Generate metrics summary for the base branch"
      run: |
        php -d error_reporting='E_ALL & ~E_DEPRECATED' ./vendor/bin/phpmetrics \
          --composer=false --report-summary-json=reports/base-summary.json .base/src/
        test -s reports/base-summary.json || {
          echo "::error::PHPMetrics produced no summary for the base branch."
          exit 1
        }

    - name: "Upload metrics summary"
      uses: "actions/upload-artifact@v4"
      with:
        name: phpmetrics-summary
        path: reports/metrics-summary.json
        retention-days: 14

    - name: "Render metrics comparison"
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const head = read('reports/metrics-summary.json');
          const base = read('reports/base-summary.json');

          // [section, key, label, lowerIsBetter]
          const METRICS = [
            ['LOC', 'linesOfCode', 'Lines of code', false],
            ['LOC', 'logicalLinesOfCode', 'Logical lines of code', false],
            ['LOC', 'logicalLinesByMethod', 'Logical lines per method', true],
            ['OOP', 'classes', 'Classes', false],
            ['OOP', 'methods', 'Methods', false],
            ['OOP', 'lackCohesionOfMethods', 'Lack of cohesion of methods', true],
            ['Complexity', 'avgCyclomaticComplexityByClass', 'Avg cyclomatic complexity / class', true],
            ['Complexity', 'avgWeightedMethodCountByClass', 'Avg weighted method count / class', true],
            ['Complexity', 'avgRelativeSystemComplexity', 'Avg relative system complexity', true],
            ['Complexity', 'avgDifficulty', 'Avg difficulty', true],
            ['Coupling', 'avgEfferentCoupling', 'Avg efferent coupling', true],
            ['Coupling', 'avgInstability', 'Avg instability', true],
            ['Bugs', 'avgBugsByClass', 'Avg bugs / class', true],
            ['Bugs', 'avgDefectsByClass', 'Avg defects / class (Kan)', true],
            ['Violations', 'critical', 'Violations: critical', true],
            ['Violations', 'error', 'Violations: error', true],
            ['Violations', 'warning', 'Violations: warning', true],
          ];

          const value = (report, section, key) => {
            const found = (report[section] || {})[key];
            return typeof found === 'number' ? found : null;
          };
          const format = (n) =>
            n === null ? 'n/a' : Number.isInteger(n) ? String(n) : n.toFixed(2);

          // Every metric PHPMetrics summarises is derived from classes, so a
          // base with none reports 0 across the board — even linesOfCode.
          // Diffing against that would render the whole table as a regression
          // from zero, so fall back to reporting this branch on its own.
          const comparable = value(base, 'OOP', 'classes') > 0;

          const rows = [];
          let regressions = 0;

          for (const [section, key, label, lowerIsBetter] of METRICS) {
            const before = value(base, section, key);
            const after = value(head, section, key);
            if (before === null && after === null) continue;

            if (!comparable) {
              rows.push(`| ${label} | ${format(after)} |`);
              continue;
            }

            let delta = '—';
            if (before !== null && after !== null) {
              const change = Math.round((after - before) * 100) / 100;
              if (change !== 0) {
                const worse = lowerIsBetter && change > 0;
                if (worse) regressions++;
                delta = `${worse ? '⚠️ ' : ''}${change > 0 ? '+' : '-'}${format(Math.abs(change))}`;
              }
            }
            rows.push(`| ${label} | ${format(before)} | ${format(after)} | ${delta} |`);
          }

          const headSha = context.payload.pull_request.head.sha.slice(0, 7);
          const baseSha = context.payload.pull_request.base.sha.slice(0, 7);
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const headline = !comparable
            ? `ℹ️ \`${baseSha}\` declares no classes, so there is no class-based baseline to diff against. Showing this branch on its own.`
            : regressions === 0
              ? '✅ No metric moved in the wrong direction.'
              : `⚠️ ${regressions} metric${regressions === 1 ? '' : 's'} moved in the wrong direction.`;

          const body = [
            '## 📊 Code Metrics Report',
            '',
            headline,
            '',
            comparable ? `\`${baseSha}\` (base) → \`${headSha}\` (PR)` : `\`${headSha}\` (PR)`,
            '',
            ...(comparable
              ? ['| Metric | Base | PR | Δ |', '| --- | ---: | ---: | ---: |']
              : ['| Metric | PR |', '| --- | ---: |']),
            ...rows,
            '',
            `<sub>PHPMetrics summary — the full JSON is attached to [this run](${runUrl}) as \`phpmetrics-summary\`.</sub>`,
          ].join('\n');

          fs.writeFileSync('reports/metrics-comment.md', body);

    - name: "Post metrics comparison"
      uses: marocchino/sticky-pull-request-comment@v3
      with:
        header: code-metrics
        path: reports/metrics-comment.md

  pot-freshness:
    name: "Translation template freshness"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
        coverage: none

    - name: "Regenerate the pot and compare source strings"
      run: |
        # -f so an HTTP error page fails the step here, rather than
        # reaching php and surfacing as a baffling parse error.
        curl -fsSL -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        php wp-cli.phar i18n make-pot . /tmp/fresh.pot --slug=archived-post-status
        grep '^msgid ' languages/archived-post-status.pot | sort -u > /tmp/committed-msgids
        grep '^msgid ' /tmp/fresh.pot | sort -u > /tmp/fresh-msgids
        diff -u /tmp/committed-msgids /tmp/fresh-msgids || {
          echo '::error::languages/archived-post-status.pot is stale — run `wp i18n make-pot . languages/archived-post-status.pot --slug=archived-post-status` and commit the result.'
          exit 1
        }

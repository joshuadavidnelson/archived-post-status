name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - stable
      - develop

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Lint matrix, PHPCS/PHPStan/PHPMD, coverage and PHPMetrics against the
  # base branch. The jobs only upload report sections; the PR Report
  # workflow (pr-report.yml) posts the comment.
  php:
    uses: joshuadavidnelson/ci/.github/workflows/php-plugin.yml@v1
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      source-paths: "src/"

  # Jest coverage and ESLint complexity for the shipped JS in assets/js.
  js:
    uses: joshuadavidnelson/ci/.github/workflows/js.yml@v1
    with:
      js-source-paths: "assets/js/"

  pot-freshness:
    name: "Translation template freshness"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
        coverage: none

    - name: "Regenerate the pot and compare source strings"
      run: |
        # -f so an HTTP error page fails the step here, rather than
        # reaching php and surfacing as a baffling parse error.
        curl -fsSL -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        php wp-cli.phar i18n make-pot . /tmp/fresh.pot --slug=archived-post-status
        grep '^msgid ' languages/archived-post-status.pot | sort -u > /tmp/committed-msgids
        grep '^msgid ' /tmp/fresh.pot | sort -u > /tmp/fresh-msgids
        diff -u /tmp/committed-msgids /tmp/fresh-msgids || {
          echo '::error::languages/archived-post-status.pot is stale — run `wp i18n make-pot . languages/archived-post-status.pot --slug=archived-post-status` and commit the result.'
          exit 1
        }

name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - stable
      - develop

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  syntax-check:
    name: "Syntax check on all PHP versions"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php }}

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ matrix.php }}-
          composer-

    - name: "Install Composer dependencies"
      run: "composer install"

    - name: "Audit dependencies for known vulnerabilities"
      run: "composer audit"

    - name: "PHP lint"
      run: "composer lint"

  code-quality:
    name: "Code quality checks"
    runs-on: "ubuntu-latest"
    needs: syntax-check
    env:
      PHP_VERSION: "8.4"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ env.PHP_VERSION }}

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ env.PHP_VERSION }}-
          composer-

    - name: "Install Composer dependencies"
      run: "composer install"

    - name: "Run PHPCS"
      run: "composer phpcs"

    - name: "Run PHPStan"
      run: "composer phpstan"

    - name: "Run PHPMD"
      run: "composer run phpmd"

  code-analysis:
    name: "Code Analysis & Metrics"
    runs-on: "ubuntu-latest"
    # Deliberately no `if: always()`. A branch that still fails lint or static
    # analysis will be pushed again anyway, so metrics computed now would just
    # be thrown away — let the job skip and run once the branch is clean.
    needs: [syntax-check, code-quality]
    # These metrics exist to review a proposed change, so there is nothing to
    # do on a push: no PR to comment on, and no baseline worth keeping.
    if: github.event_name == 'pull_request'
    permissions:
      contents: "read"
      pull-requests: "write"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    # The base is analysed from source in this same job rather than pulled from
    # a stored artifact, so the delta is a true base-vs-head comparison and is
    # available on every PR, including the first one after this job changes.
    - name: "Checkout base branch for comparison"
      uses: "actions/checkout@v6"
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: ".base"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: '8.4'

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-8.4-${{ hashFiles('composer.lock') }}
        restore-keys: composer-8.4-

    - name: "Install dependencies"
      run: composer install

    # PHPMetrics writes nothing, and still exits 0, when it cannot write the
    # report — so both runs assert the file landed rather than trusting the
    # exit status. Note `--quiet` is never used: it suppresses report writing
    # altogether. `--composer=false` skips a packagist request on every run and
    # leaves every metric in the summary report unchanged.
    - name: "Generate metrics summary"
      run: |
        composer run phpmetrics-summary
        test -s reports/metrics-summary.json || {
          echo "::error::PHPMetrics produced no summary for the PR branch."
          exit 1
        }

    - name: "Generate metrics summary for the base branch"
      run: |
        php -d error_reporting='E_ALL & ~E_DEPRECATED' ./vendor/bin/phpmetrics \
          --composer=false --report-summary-json=reports/base-summary.json .base/src/
        test -s reports/base-summary.json || {
          echo "::error::PHPMetrics produced no summary for the base branch."
          exit 1
        }

    # ~1KB of flat JSON, attached under a stable name so it is easy to find on
    # a run. Artifacts are scoped per run, so this is one small file per run,
    # aged out well inside the window where the PR is still being reviewed.
    - name: "Upload metrics summary"
      uses: "actions/upload-artifact@v4"
      with:
        name: phpmetrics-summary
        path: reports/metrics-summary.json
        retention-days: 14

    - name: "Find existing metrics comment"
      id: find-comment
      uses: peter-evans/find-comment@v3
      with:
        issue-number: ${{ github.event.number }}
        comment-author: 'github-actions[bot]'
        body-includes: '📊 Code Metrics Report'

    - name: "Post metrics comparison"
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const head = read('reports/metrics-summary.json');
          const base = read('reports/base-summary.json');

          // [section, key, label, lowerIsBetter]
          const METRICS = [
            ['LOC', 'linesOfCode', 'Lines of code', false],
            ['LOC', 'logicalLinesOfCode', 'Logical lines of code', false],
            ['LOC', 'logicalLinesByMethod', 'Logical lines per method', true],
            ['OOP', 'classes', 'Classes', false],
            ['OOP', 'methods', 'Methods', false],
            ['OOP', 'lackCohesionOfMethods', 'Lack of cohesion of methods', true],
            ['Complexity', 'avgCyclomaticComplexityByClass', 'Avg cyclomatic complexity / class', true],
            ['Complexity', 'avgWeightedMethodCountByClass', 'Avg weighted method count / class', true],
            ['Complexity', 'avgRelativeSystemComplexity', 'Avg relative system complexity', true],
            ['Complexity', 'avgDifficulty', 'Avg difficulty', true],
            ['Coupling', 'avgEfferentCoupling', 'Avg efferent coupling', true],
            ['Coupling', 'avgInstability', 'Avg instability', true],
            ['Bugs', 'avgBugsByClass', 'Avg bugs / class', true],
            ['Bugs', 'avgDefectsByClass', 'Avg defects / class (Kan)', true],
            ['Violations', 'critical', 'Violations: critical', true],
            ['Violations', 'error', 'Violations: error', true],
            ['Violations', 'warning', 'Violations: warning', true],
          ];

          const value = (report, section, key) => {
            const found = (report[section] || {})[key];
            return typeof found === 'number' ? found : null;
          };
          const format = (n) =>
            n === null ? 'n/a' : Number.isInteger(n) ? String(n) : n.toFixed(2);

          const rows = [];
          let regressions = 0;

          for (const [section, key, label, lowerIsBetter] of METRICS) {
            const before = value(base, section, key);
            const after = value(head, section, key);
            if (before === null && after === null) continue;

            let delta = '—';
            if (before !== null && after !== null) {
              const change = Math.round((after - before) * 100) / 100;
              if (change !== 0) {
                const worse = lowerIsBetter && change > 0;
                if (worse) regressions++;
                delta = `${worse ? '⚠️ ' : ''}${change > 0 ? '+' : '-'}${format(Math.abs(change))}`;
              }
            }
            rows.push(`| ${label} | ${format(before)} | ${format(after)} | ${delta} |`);
          }

          const headSha = context.payload.pull_request.head.sha.slice(0, 7);
          const baseSha = context.payload.pull_request.base.sha.slice(0, 7);
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const body = [
            '## 📊 Code Metrics Report',
            '',
            regressions === 0
              ? '✅ No metric moved in the wrong direction.'
              : `⚠️ ${regressions} metric${regressions === 1 ? '' : 's'} moved in the wrong direction.`,
            '',
            `\`${baseSha}\` (base) → \`${headSha}\` (PR)`,
            '',
            '| Metric | Base | PR | Δ |',
            '| --- | ---: | ---: | ---: |',
            ...rows,
            '',
            `<sub>PHPMetrics summary — the full JSON is attached to [this run](${runUrl}) as \`phpmetrics-summary\`.</sub>`,
          ].join('\n');

          const commentId = '${{ steps.find-comment.outputs.comment-id }}';

          if (commentId) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(commentId),
              body,
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
          }

  pot-freshness:
    name: "Translation template freshness"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.4"
        coverage: none

    - name: "Regenerate the pot and compare source strings"
      # Compares the msgid set only — immune to header/reference churn
      # from differing make-pot flags. A mismatch means a user-facing
      # string changed without `wp i18n make-pot` being re-run.
      run: |
        curl -sSLO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
        php wp-cli.phar i18n make-pot . /tmp/fresh.pot --slug=archived-post-status
        grep '^msgid ' languages/archived-post-status.pot | sort -u > /tmp/committed-msgids
        grep '^msgid ' /tmp/fresh.pot | sort -u > /tmp/fresh-msgids
        diff -u /tmp/committed-msgids /tmp/fresh-msgids || {
          echo '::error::languages/archived-post-status.pot is stale — run `wp i18n make-pot . languages/archived-post-status.pot --slug=archived-post-status` and commit the result.'
          exit 1
        }

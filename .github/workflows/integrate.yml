name: "Integrate"

on:
  pull_request: null
  push:
    branches:
      - stable

jobs:
  syntax-check:
    name: "Syntax check on all PHP versions"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php }}

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ matrix.php }}-
          composer-

    - name: "Install Composer dependencies"
      run: "composer install"

    - name: "PHP lint"
      run: "composer lint"

  code-quality:
    name: "Code quality checks"
    runs-on: "ubuntu-latest"
    env:
      PHP_VERSION: "8.4"
    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ env.PHP_VERSION }}

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ env.PHP_VERSION }}-
          composer-

    - name: "Install Composer dependencies"
      run: "composer install"

    - name: "Run PHPCS"
      run: "composer phpcs"

    - name: "Run PHPStan"
      run: "composer phpstan"

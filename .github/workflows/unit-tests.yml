name: "Unit Tests"

on:
  pull_request: null
  push:
    branches:
      - stable
      - develop

jobs:
  phpunit:
    name: "PHPUnit Tests"
    runs-on: "ubuntu-latest"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v3"

    - name: "Install PHP"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: "8.2"
      env:
        debug: true

    - name: "Install dependencies"
      run: "composer install"

    - name: "PHPUnit Tests"
      run: 'composer run phpunit'

  jest:
    name: "Javascript Unit Tests"
    runs-on: "ubuntu-latest"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v3"

    - name: "Setup Node.js"
      uses: "actions/setup-node@v5"
      with:
        node-version: '20'
        cache: 'npm'

    - name: "Install npm dependencies"
      run: "npm install"

    - name: "Run Jest tests"
      run: "npm run test"

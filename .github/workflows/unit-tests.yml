name: "Unit Tests"

on:
  pull_request: null
  push:
    branches:
      - stable

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  phpunit:
    name: ${{ matrix.php-versions }} PHPUnit Tests
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php-versions: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Set up PHP and Composer"
      # No coverage driver: these legs exist to prove the suite runs on every
      # supported PHP, and the coverage job below owns measurement.
      uses: "./.github/actions/setup-php-composer"
      with:
        php-version: ${{ matrix.php-versions }}

    - name: "PHPUnit Tests"
      run: 'composer phpunit'

  jest:
    name: "Javascript Unit Tests"
    runs-on: "ubuntu-latest"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v7"

    - name: "Setup Node.js"
      uses: "actions/setup-node@v5"
      with:
        node-version: '26'
        cache: 'npm'

    - name: "Install npm dependencies"
      # ci, not install: it installs strictly from the lock file and fails
      # loudly when package.json and the lock file have drifted apart.
      run: "npm ci"

    - name: "Run Jest tests"
      run: "npm test"

    - name: "Run workflow script tests"
      # Separate config and suite from the shipped assets/js code above —
      # sharing the job only to reuse the node_modules already installed.
      run: "npm run test:workflows"


name: "Unit Tests"

on:
  pull_request: null
  push:
    branches:
      - stable

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  phpunit:
    name: ${{ matrix.php-versions }} PHPUnit Tests
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        php-versions: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Set PHP version"
      uses: "shivammathur/setup-php@v2"
      with:
        php-version: ${{ matrix.php-versions }}
        # Coverage is collected on the newest matrix leg only — the other
        # legs exist for runtime compatibility, not coverage duplication.
        coverage: ${{ matrix.php-versions == '8.4' && 'xdebug' || 'none' }}
        tools: phpunit, phpunit-polyfills, composer:v2
      env:
        debug: true

    - name: "Cache Composer dependencies"
      uses: "actions/cache@v4"
      with:
        path: vendor
        key: composer-${{ matrix.php-versions }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          composer-${{ matrix.php-versions }}-
          composer-

    - name: "Install dependencies"
      run: "composer install"

    - name: "PHPUnit Tests"
      run: 'composer phpunit'

    - name: "Coverage report"
      if: ${{ matrix.php-versions == '8.4' }}
      run: 'composer phpunit:coverage'

  jest:
    name: "Javascript Unit Tests"
    runs-on: "ubuntu-latest"

    steps:
    - name: "Checkout"
      uses: "actions/checkout@v6"

    - name: "Setup Node.js"
      uses: "actions/setup-node@v5"
      with:
        node-version: '20'
        cache: 'npm'

    - name: "Install npm dependencies"
      run: "npm install"

    - name: "Run Jest tests with coverage thresholds"
      run: "npm run test:coverage"
